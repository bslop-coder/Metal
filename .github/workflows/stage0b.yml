name: stage0b-header
on:
  workflow_dispatch:
jobs:
  header:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Clone at the pinned commit
        shell: bash
        run: |
          git clone https://github.com/leejet/stable-diffusion.cpp sd
          cd sd
          git checkout fc350be2ceeeb859bcc201ac435591ed7d46821d
          git log -1 --format='commit %H'

      - name: Write report
        shell: bash
        run: |
          {
            echo '## Full header'
            cat -n sd/include/stable-diffusion.h
            echo
            echo '## docs/backend_probe.md'
            cat sd/docs/backend_probe.md
            echo
            echo '## docs/troubleshooting.md'
            cat sd/docs/troubleshooting.md
            echo
            echo '## docs/quantization_and_gguf.md, first 120 lines'
            sed -n 1,120p sd/docs/quantization_and_gguf.md
          } > report0b.txt
          wc -l report0b.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: report0b
          path: report0b.txt

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo '```'
            cat report0b.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
